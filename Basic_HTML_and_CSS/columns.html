<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruits, Vegetables, and Berries</title>

    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Fruits, Vegetables, and Berries</h1>

    <table>
        <colgroup>
            <col style="background-color: lightpink;">
            <col style="background-color: lightgreen;">
            <col style="background-color: lavender;">
        </colgroup>

        <tr>
            <th>Fruits</th>
            <th>Vegetables</th>
            <th>Berries</th>
        </tr>

        <tr>
            <td>Apple</td>
            <td>Carrot</td>
            <td>Strawberry</td>
        </tr>

        <tr>
            <td>Banana</td>
            <td>Broccoli</td>
            <td>Blueberry</td>
        </tr>

        <tr>
            <td>Orange</td>
            <td>Cucumber</td>
            <td>Raspberry</td>
        </tr>

        <tr>
            <td>Grapes</td>
            <td>Spinach</td>
            <td>Blackberry</td>
        </tr>

    </table>

</body>
</html>
