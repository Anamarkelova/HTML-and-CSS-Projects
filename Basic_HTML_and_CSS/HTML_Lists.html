<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
	<link rel="stylesheet" type="text/css" href="CSS_Lists.css">
</head>
<body>
	<h1>My HTML Lists</h1>
	<h2>Unordered List</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ul>
	<h2>Ordered List</h2>
    <ol>
        <li>Wake up</li>
        <li>Brush teeth</li>
        <li>Fix your bed</li>
        <li>Eat breakfast</li>
    </ol>
</body>
</html>
